<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>us.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1a2b;
    --bg-panel: #242138;
    --bg-input: #2b2844;
    --accent: #d98a9c;
    --accent-soft: #e9c3cc;
    --text: #f3efe9;
    --text-dim: #9e9ab8;
    --line: #34304f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  #app {
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Join screen ---------- */
  #join {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }

  #join .mark {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 44px;
    color: var(--accent-soft);
    margin: 0 0 6px;
  }

  #join p.sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 32px;
    max-width: 280px;
    line-height: 1.5;
  }

  #join input {
    width: 100%;
    max-width: 280px;
    background: var(--bg-input);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    text-align: center;
  }

  #join input::placeholder { color: var(--text-dim); }
  #join input:focus { border-color: var(--accent); }

  #join button {
    margin-top: 14px;
    width: 100%;
    max-width: 280px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #241922;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 16px;
    cursor: pointer;
  }

  #join button:disabled { opacity: 0.5; cursor: default; }

  #join .status {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    max-width: 280px;
    line-height: 1.5;
  }

  /* ---------- Chat screen ---------- */
  #chat { display: none; flex-direction: column; height: 100%; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-panel);
  }

  header .who {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--accent-soft);
  }

  header .as {
    font-size: 12px;
    color: var(--text-dim);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 6px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 74%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.42;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .bubble .meta {
    display: block;
    font-size: 10.5px;
    margin-top: 4px;
    opacity: 0.65;
  }

  .mine {
    align-self: flex-end;
    background: var(--accent);
    color: #241922;
    border-bottom-right-radius: 4px;
  }

  .theirs {
    align-self: flex-start;
    background: var(--bg-input);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .day-divider {
    align-self: center;
    font-size: 11px;
    color: var(--text-dim);
    margin: 6px 0;
  }

  #composer {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid var(--line);
    background: var(--bg-panel);
  }

  #composer textarea {
    flex: 1;
    resize: none;
    background: var(--bg-input);
    border: 1px solid var(--line);
    border-radius: 20px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 11px 16px;
    outline: none;
    max-height: 100px;
    line-height: 1.35;
  }

  #composer textarea:focus { border-color: var(--accent); }

  #composer button {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #241922;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #composer button:disabled { opacity: 0.4; cursor: default; }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">

  <div id="join">
    <p class="mark">us.</p>
    <p class="sub">A little room just for the two of you. Type your name to go in.</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
    <button id="joinBtn" disabled>Enter</button>
    <div class="status" id="joinStatus"></div>
  </div>

  <div id="chat">
    <header>
      <div class="who" id="whoLabel">us.</div>
      <div class="as" id="asLabel"></div>
    </header>
    <div id="messages"></div>
    <div id="composer">
      <textarea id="textInput" placeholder="Type a message…" rows="1"></textarea>
      <button id="sendBtn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  const joinStatusEl = document.getElementById("joinStatus");
  const joinBtnEl = document.getElementById("joinBtn");

  function showError(prefix, err) {
    const msg = (err && (err.message || err.toString())) || "Unknown error";
    console.error(prefix, err);
    joinStatusEl.textContent = prefix + ": " + msg;
  }

  function setStatus(msg) {
    joinStatusEl.textContent = msg;
  }

  window.addEventListener("error", (e) => {
    if (e.error) showError("Page error", e.error);
  });

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => resolve(src);
      s.onerror = () => reject(new Error("failed to load " + src));
      document.head.appendChild(s);
    });
  }

  const CDNS = [
    "https://www.gstatic.com/firebasejs/10.13.0/",
    "https://cdn.jsdelivr.net/npm/firebase@10.13.0/",
    "https://unpkg.com/firebase@10.13.0/"
  ];

  let db, messagesRef;
  let ready = false;

  async function loadFirebase() {
    setStatus("Connecting…");
    let lastErr = null;

    for (const base of CDNS) {
      try {
        await loadScript(base + "firebase-app-compat.js");
        await loadScript(base + "firebase-database-compat.js");
        if (typeof firebase === "undefined") throw new Error("script loaded but firebase global missing");
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
        continue;
      }
    }

    if (lastErr || typeof firebase === "undefined") {
      showError(
        "Setup problem",
        new Error("Couldn't load the Firebase library from any source. This usually means something on this network/browser is blocking it (ad blocker, firewall, VPN, or offline). Try a different network, disable blockers for this page, or try a different browser.")
      );
      return;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBHZkTI5szqalZ4J4FoibaThDrd8j8HYIk",
      authDomain: "private-chat-1de91.firebaseapp.com",
      databaseURL: "https://private-chat-1de91-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "private-chat-1de91",
      appId: "1:991019862496:web:02bdbc1d5f28e5b2068385"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      messagesRef = db.ref("messages");
      ready = true;
      setStatus("");
      joinBtnEl.disabled = nameInput.value.trim().length === 0;
    } catch (err) {
      showError("Firebase init failed", err);
    }
  }

  loadFirebase();

  let myName = "";

  const joinScreen = document.getElementById("join");
  const chatScreen = document.getElementById("chat");
  const nameInput = document.getElementById("nameInput");
  const joinBtn = document.getElementById("joinBtn");
  const joinStatus = document.getElementById("joinStatus");
  const whoLabel = document.getElementById("whoLabel");
  const asLabel = document.getElementById("asLabel");
  const messagesEl = document.getElementById("messages");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");

  // Pre-fill name from URL hash if present, e.g. #name=Alex
  const hashMatch = location.hash.match(/name=([^&]+)/);
  if (hashMatch) {
    nameInput.value = decodeURIComponent(hashMatch[1]);
    joinBtn.disabled = nameInput.value.trim().length === 0;
  }

  nameInput.addEventListener("input", () => {
    joinBtn.disabled = nameInput.value.trim().length === 0 || !ready;
  });

  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !joinBtn.disabled) enterChat();
  });

  joinBtn.addEventListener("click", enterChat);

  function enterChat() {
    if (!ready) return;
    myName = nameInput.value.trim();
    if (!myName) return;

    location.hash = "name=" + encodeURIComponent(myName);
    asLabel.textContent = "you're " + myName;
    joinScreen.style.display = "none";
    chatScreen.style.display = "flex";
    listenForMessages();
    textInput.focus();
  }

  let lastDay = null;

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function dayLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  }

  function renderMessage(msg) {
    const day = dayLabel(msg.time);
    if (day !== lastDay) {
      const divider = document.createElement("div");
      divider.className = "day-divider";
      divider.textContent = day;
      messagesEl.appendChild(divider);
      lastDay = day;
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble " + (msg.sender === myName ? "mine" : "theirs");

    const textNode = document.createElement("span");
    textNode.textContent = msg.text;
    bubble.appendChild(textNode);

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = (msg.sender === myName ? "" : msg.sender + " · ") + formatTime(msg.time);
    bubble.appendChild(meta);

    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  let listening = false;
  function listenForMessages() {
    if (!messagesRef) {
      showError("Can't connect", new Error("Firebase never initialized. Reload the page and check the console for details."));
      return;
    }
    if (listening) return;
    listening = true;
    joinStatus.textContent = "";

    messagesRef.limitToLast(200).on("child_added", (snapshot) => {
      renderMessage(snapshot.val());
    }, (err) => {
      showError("Couldn't connect to the database", err);
    });
  }

  function sendMessage() {
    const text = textInput.value.trim();
    if (!text || !messagesRef) return;
    messagesRef.push({
      sender: myName,
      text: text,
      time: Date.now()
    }).catch((err) => showError("Message didn't send", err));
    textInput.value = "";
    textInput.style.height = "auto";
  }

  sendBtn.addEventListener("click", sendMessage);
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  textInput.addEventListener("input", () => {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 100) + "px";
  });
</script>
</body>
</html>
