<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>us.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1a2b;
    --bg-panel: #242138;
    --bg-input: #2b2844;
    --accent: #d98a9c;
    --accent-soft: #e9c3cc;
    --text: #f3efe9;
    --text-dim: #9e9ab8;
    --line: #34304f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  #app {
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Join screen ---------- */
  #join {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }

  #join .mark {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 44px;
    color: var(--accent-soft);
    margin: 0 0 6px;
  }

  #join p.sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 32px;
    max-width: 280px;
    line-height: 1.5;
  }

  #join input {
    width: 100%;
    max-width: 280px;
    background: var(--bg-input);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    text-align: center;
  }

  #join input::placeholder { color: var(--text-dim); }
  #join input:focus { border-color: var(--accent); }

  #join button {
    margin-top: 14px;
    width: 100%;
    max-width: 280px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #241922;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 16px;
    cursor: pointer;
  }

  #join button:disabled { opacity: 0.5; cursor: default; }

  #join .status {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    max-width: 280px;
    line-height: 1.5;
  }

  /* ---------- Chat screen ---------- */
  #chat { display: none; flex-direction: column; height: 100%; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-panel);
  }

  header .who {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--accent-soft);
  }

  header .as {
    font-size: 12px;
    color: var(--text-dim);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 6px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 74%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.42;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .bubble .meta {
    display: block;
    font-size: 10.5px;
    margin-top: 4px;
    opacity: 0.65;
  }

  .mine {
    align-self: flex-end;
    background: var(--accent);
    color: #241922;
    border-bottom-right-radius: 4px;
  }

  .theirs {
    align-self: flex-start;
    background: var(--bg-input);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .day-divider {
    align-self: center;
    font-size: 11px;
    color: var(--text-dim);
    margin: 6px 0;
  }

  #composer {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid var(--line);
    background: var(--bg-panel);
  }

  #composer textarea {
    flex: 1;
    resize: none;
    background: var(--bg-input);
    border: 1px solid var(--line);
    border-radius: 20px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 11px 16px;
    outline: none;
    max-height: 100px;
    line-height: 1.35;
  }

  #composer textarea:focus { border-color: var(--accent); }

  #composer button {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #241922;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #composer button:disabled { opacity: 0.4; cursor: default; }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* ---------- Header call buttons ---------- */
  header .head-left { display: flex; flex-direction: column; }
  header .call-actions { display: flex; gap: 8px; }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg-input);
    color: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    padding: 0;
  }

  .icon-btn:hover { border-color: var(--accent); }

  #composer .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    width: 40px;
    height: 44px;
  }

  /* ---------- Attachments ---------- */
  .file-bubble { padding: 6px; }
  .file-bubble img {
    max-width: 220px;
    max-height: 260px;
    border-radius: 12px;
    display: block;
    cursor: pointer;
  }
  .file-bubble .meta { padding: 4px 6px 0; }

  .file-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 170px;
    text-decoration: none;
    color: inherit;
  }

  .file-chip .file-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    font-size: 15px;
  }

  .file-chip .file-info { display: flex; flex-direction: column; min-width: 0; }
  .file-chip .file-name {
    font-size: 13.5px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 160px;
  }
  .file-chip .file-size { font-size: 11px; opacity: 0.7; }

  .upload-progress {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 160px;
  }
  .upload-progress .bar-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .upload-progress .bar-fill {
    height: 100%;
    background: currentColor;
    width: 0%;
    transition: width 0.15s ease;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 40;
    display: none;
    max-width: 82%;
    text-align: center;
  }

  /* ---------- Call overlay ---------- */
  #callOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #100e1c;
    z-index: 20;
  }

  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  #localVideo {
    position: absolute;
    width: 96px;
    height: 128px;
    right: 16px;
    top: 16px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid var(--line);
    background: #000;
  }

  #callStatusLabel {
    position: absolute;
    top: 20px;
    left: 20px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--accent-soft);
    background: rgba(0,0,0,0.35);
    padding: 6px 14px;
    border-radius: 20px;
  }

  #audioOnlyLabel {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }

  #audioOnlyLabel .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--accent);
    color: #241922;
    font-family: 'Fraunces', serif;
    font-size: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #audioOnlyName {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--text);
  }

  #callControls {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 18px;
  }

  #callControls button {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fff;
    font-size: 20px;
    background: rgba(255,255,255,0.15);
  }

  #muteBtn.active, #camBtn.active { background: var(--accent); color: #241922; }
  #hangupBtn { background: #d9534f; }

  /* ---------- Incoming call ---------- */
  #incomingCall {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(16, 14, 28, 0.94);
    z-index: 25;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    text-align: center;
    padding: 24px;
  }

  #incomingCall .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--accent);
    color: #241922;
    font-family: 'Fraunces', serif;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  #incomingCallName {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 24px;
    color: var(--text);
  }

  #incomingCallType {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  #incomingCallActions { display: flex; gap: 24px; }

  #incomingCallActions button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    color: #fff;
    font-size: 20px;
  }

  #declineBtn { background: #d9534f; }
  #acceptBtn { background: #4caf82; }
</style>
</head>
<body>
<div id="app">

  <div id="join">
    <p class="mark">Private Chat</p>
    <p class="sub">A little room just for the two of us. Type your name to go in.</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
    <button id="joinBtn" disabled>Enter</button>
    <div class="status" id="joinStatus"></div>
  </div>

  <div id="chat">
    <header>
      <div class="head-left">
        <div class="who" id="whoLabel">Private Chat</div>
        <div class="as" id="asLabel"></div>
      </div>
      <div class="call-actions">
        <button class="icon-btn" id="voiceCallBtn" title="Voice call" aria-label="Voice call">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="videoCallBtn" title="Video call" aria-label="Video call">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <div id="messages"></div>
    <div id="composer">
      <input type="file" id="fileInput" hidden />
      <button class="icon-btn" id="attachBtn" aria-label="Attach a file" title="Attach a file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M16.5 6.5l-8 8a3 3 0 1 0 4.24 4.24l7.07-7.07a5 5 0 1 0-7.07-7.07l-8.49 8.49" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <textarea id="textInput" placeholder="Type a message…" rows="1"></textarea>
      <button id="sendBtn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="callOverlay">
    <div id="callStatusLabel">Calling…</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="audioOnlyLabel">
      <div class="avatar" id="audioAvatar">?</div>
      <div id="audioOnlyName">Voice call</div>
    </div>
    <div id="callControls">
      <button id="muteBtn" title="Mute">🎙️</button>
      <button id="camBtn" title="Turn camera off">🎥</button>
      <button id="hangupBtn" title="Hang up">⏹</button>
    </div>
  </div>

  <div id="incomingCall">
    <div class="avatar" id="incomingAvatar">?</div>
    <div id="incomingCallName"></div>
    <div id="incomingCallType"></div>
    <div id="incomingCallActions">
      <button id="declineBtn" title="Decline">✕</button>
      <button id="acceptBtn" title="Accept">✓</button>
    </div>
  </div>

  <div id="toast"></div>

</div>

<script>
  const joinStatusEl = document.getElementById("joinStatus");
  const joinBtnEl = document.getElementById("joinBtn");

  function showError(prefix, err) {
    const msg = (err && (err.message || err.toString())) || "Unknown error";
    console.error(prefix, err);
    joinStatusEl.textContent = prefix + ": " + msg;
  }

  function setStatus(msg) {
    joinStatusEl.textContent = msg;
  }

  window.addEventListener("error", (e) => {
    if (e.error) showError("Page error", e.error);
  });

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => resolve(src);
      s.onerror = () => reject(new Error("failed to load " + src));
      document.head.appendChild(s);
    });
  }

  const CDNS = [
    "https://www.gstatic.com/firebasejs/10.13.0/",
    "https://cdn.jsdelivr.net/npm/firebase@10.13.0/",
    "https://unpkg.com/firebase@10.13.0/"
  ];

  let db, messagesRef;
  let ready = false;

  // Firebase Storage bucket naming changed over time. We try the newer
  // format first, then fall back to the legacy one if uploads fail.
  const STORAGE_BUCKET_CANDIDATES = [
    "private-chat-1de91.firebasestorage.app",
    "private-chat-1de91.appspot.com"
  ];
  let storageBucketIndex = 0;

  function getStorage() {
    return firebase.app().storage("gs://" + STORAGE_BUCKET_CANDIDATES[storageBucketIndex]);
  }

  async function loadFirebase() {
    setStatus("Connecting…");
    let lastErr = null;

    for (const base of CDNS) {
      try {
        await loadScript(base + "firebase-app-compat.js");
        await loadScript(base + "firebase-database-compat.js");
        await loadScript(base + "firebase-storage-compat.js");
        if (typeof firebase === "undefined") throw new Error("script loaded but firebase global missing");
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
        continue;
      }
    }

    if (lastErr || typeof firebase === "undefined") {
      showError(
        "Setup problem",
        new Error("Couldn't load the Firebase library from any source. This usually means something on this network/browser is blocking it (ad blocker, firewall, VPN, or offline). Try a different network, disable blockers for this page, or try a different browser.")
      );
      return;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBHZkTI5szqalZ4J4FoibaThDrd8j8HYIk",
      authDomain: "private-chat-1de91.firebaseapp.com",
      databaseURL: "https://private-chat-1de91-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "private-chat-1de91",
      appId: "1:991019862496:web:02bdbc1d5f28e5b2068385"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      messagesRef = db.ref("messages");
      ready = true;
      setStatus("");
      joinBtnEl.disabled = nameInput.value.trim().length === 0;
    } catch (err) {
      showError("Firebase init failed", err);
    }
  }

  loadFirebase();

  let myName = "";

  const joinScreen = document.getElementById("join");
  const chatScreen = document.getElementById("chat");
  const nameInput = document.getElementById("nameInput");
  const joinBtn = document.getElementById("joinBtn");
  const joinStatus = document.getElementById("joinStatus");
  const whoLabel = document.getElementById("whoLabel");
  const asLabel = document.getElementById("asLabel");
  const messagesEl = document.getElementById("messages");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");

  // Pre-fill name from URL hash if present, e.g. #name=Alex
  const hashMatch = location.hash.match(/name=([^&]+)/);
  if (hashMatch) {
    nameInput.value = decodeURIComponent(hashMatch[1]);
    joinBtn.disabled = nameInput.value.trim().length === 0;
  }

  nameInput.addEventListener("input", () => {
    joinBtn.disabled = nameInput.value.trim().length === 0 || !ready;
  });

  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !joinBtn.disabled) enterChat();
  });

  joinBtn.addEventListener("click", enterChat);

  function enterChat() {
    if (!ready) return;
    myName = nameInput.value.trim();
    if (!myName) return;

    location.hash = "name=" + encodeURIComponent(myName);
    asLabel.textContent = "you're " + myName;
    joinScreen.style.display = "none";
    chatScreen.style.display = "flex";
    listenForMessages();
    watchForIncomingCalls();
    textInput.focus();
  }

  let lastDay = null;

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function dayLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  }

  function renderMessage(msg) {
    const day = dayLabel(msg.time);
    if (day !== lastDay) {
      const divider = document.createElement("div");
      divider.className = "day-divider";
      divider.textContent = day;
      messagesEl.appendChild(divider);
      lastDay = day;
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble " + (msg.sender === myName ? "mine" : "theirs");

    if (msg.type === "image") {
      bubble.classList.add("file-bubble");
      const img = document.createElement("img");
      img.src = msg.url;
      img.alt = msg.fileName || "photo";
      img.addEventListener("click", () => window.open(msg.url, "_blank"));
      bubble.appendChild(img);
    } else if (msg.type === "file") {
      const chip = document.createElement("a");
      chip.className = "file-chip";
      chip.href = msg.url;
      chip.target = "_blank";
      chip.rel = "noopener";

      const icon = document.createElement("span");
      icon.className = "file-icon";
      icon.textContent = "📎";

      const info = document.createElement("span");
      info.className = "file-info";

      const nameEl = document.createElement("span");
      nameEl.className = "file-name";
      nameEl.textContent = msg.fileName || "File";

      const sizeEl = document.createElement("span");
      sizeEl.className = "file-size";
      sizeEl.textContent = formatBytes(msg.fileSize || 0);

      info.appendChild(nameEl);
      info.appendChild(sizeEl);
      chip.appendChild(icon);
      chip.appendChild(info);
      bubble.appendChild(chip);
    } else {
      const textNode = document.createElement("span");
      textNode.textContent = msg.text;
      bubble.appendChild(textNode);
    }

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = (msg.sender === myName ? "" : msg.sender + " · ") + formatTime(msg.time);
    bubble.appendChild(meta);

    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  let listening = false;
  function listenForMessages() {
    if (!messagesRef) {
      showError("Can't connect", new Error("Firebase never initialized. Reload the page and check the console for details."));
      return;
    }
    if (listening) return;
    listening = true;
    joinStatus.textContent = "";

    messagesRef.limitToLast(200).on("child_added", (snapshot) => {
      renderMessage(snapshot.val());
    }, (err) => {
      showError("Couldn't connect to the database", err);
    });
  }

  function sendMessage() {
    const text = textInput.value.trim();
    if (!text || !messagesRef) return;
    messagesRef.push({
      sender: myName,
      text: text,
      time: Date.now()
    }).catch((err) => showError("Message didn't send", err));
    textInput.value = "";
    textInput.style.height = "auto";
  }

  function formatBytes(bytes) {
    if (!bytes) return "0 KB";
    const kb = bytes / 1024;
    if (kb < 1024) return Math.round(kb) + " KB";
    return (kb / 1024).toFixed(1) + " MB";
  }

  let toastTimer = null;
  function showToast(msg) {
    const toastEl = document.getElementById("toast");
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 4000);
  }

  const fileInput = document.getElementById("fileInput");
  const attachBtn = document.getElementById("attachBtn");

  attachBtn.addEventListener("click", () => {
    if (!ready) {
      showToast("Still connecting…");
      return;
    }
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    fileInput.value = "";
    if (file) uploadFile(file);
  });

  const MAX_FILE_SIZE = 25 * 1024 * 1024; // 25MB

  function renderUploadProgress(id, fileName) {
    const bubble = document.createElement("div");
    bubble.className = "bubble mine";
    bubble.id = id;

    const wrap = document.createElement("div");
    wrap.className = "upload-progress";

    const label = document.createElement("span");
    label.textContent = "Sending " + fileName + "…";
    label.style.fontSize = "12.5px";

    const track = document.createElement("div");
    track.className = "bar-track";
    const fill = document.createElement("div");
    fill.className = "bar-fill";
    track.appendChild(fill);

    wrap.appendChild(label);
    wrap.appendChild(track);
    bubble.appendChild(wrap);

    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function updateUploadProgress(id, pct) {
    const bubble = document.getElementById(id);
    if (!bubble) return;
    const fill = bubble.querySelector(".bar-fill");
    if (fill) fill.style.width = pct + "%";
  }

  function removeUploadProgress(id) {
    const bubble = document.getElementById(id);
    if (bubble) bubble.remove();
  }

  function uploadFile(file, attempt) {
    attempt = attempt || 0;
    if (!ready || !messagesRef) {
      showToast("Not connected yet.");
      return;
    }
    if (file.size > MAX_FILE_SIZE) {
      showToast("That file is too large (max 25 MB).");
      return;
    }

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = "attachments/" + Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "_" + safeName;
    const storageRef = getStorage().ref(path);
    const task = storageRef.put(file);
    const progressId = "upl_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    renderUploadProgress(progressId, file.name);

    task.on("state_changed", (snap) => {
      const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
      updateUploadProgress(progressId, pct);
    }, (err) => {
      if (attempt === 0 && STORAGE_BUCKET_CANDIDATES.length > 1) {
        storageBucketIndex = 1;
        removeUploadProgress(progressId);
        uploadFile(file, 1);
        return;
      }
      removeUploadProgress(progressId);
      showError("Upload failed", err);
    }, async () => {
      try {
        const url = await task.snapshot.ref.getDownloadURL();
        removeUploadProgress(progressId);
        await messagesRef.push({
          sender: myName,
          type: file.type.startsWith("image/") ? "image" : "file",
          url: url,
          fileName: file.name,
          fileSize: file.size,
          time: Date.now()
        });
      } catch (err) {
        removeUploadProgress(progressId);
        showError("Upload finished but message didn't send", err);
      }
    });
  }

  sendBtn.addEventListener("click", sendMessage);
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  textInput.addEventListener("input", () => {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 100) + "px";
  });

  // ================= Voice / Video calling =================
  // Signaling (who's calling whom, and connection details) travels through
  // your Firebase database at /calls. The actual audio/video streams travel
  // directly between the two devices (WebRTC), not through Firebase.
  const ICE_SERVERS = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
    // If calls fail to connect on some networks (corporate wifi, some mobile
    // carriers), you likely need a TURN server. Get a free one (e.g. from
    // metered.ca or Twilio) and add it here, e.g.:
    // { urls: "turn:your.turn.server:3478", username: "user", credential: "pass" }
  ];

  let pc = null;
  let localStream = null;
  let callRole = null; // 'caller' | 'callee'
  let inCall = false;
  let pendingRemoteCandidates = [];
  let answerListenerRef = null;
  let candidateListenerRef = null;

  const callOverlay = document.getElementById("callOverlay");
  const remoteVideo = document.getElementById("remoteVideo");
  const localVideo = document.getElementById("localVideo");
  const callStatusLabel = document.getElementById("callStatusLabel");
  const audioOnlyLabel = document.getElementById("audioOnlyLabel");
  const audioAvatar = document.getElementById("audioAvatar");
  const muteBtn = document.getElementById("muteBtn");
  const camBtn = document.getElementById("camBtn");
  const hangupBtn = document.getElementById("hangupBtn");
  const incomingCallEl = document.getElementById("incomingCall");
  const incomingAvatar = document.getElementById("incomingAvatar");
  const incomingCallName = document.getElementById("incomingCallName");
  const incomingCallType = document.getElementById("incomingCallType");
  const acceptBtn = document.getElementById("acceptBtn");
  const declineBtn = document.getElementById("declineBtn");
  const voiceCallBtn = document.getElementById("voiceCallBtn");
  const videoCallBtn = document.getElementById("videoCallBtn");

  function watchForIncomingCalls() {
    if (!db) return;

    db.ref("calls/offer").on("value", (snap) => {
      const offer = snap.val();
      if (!offer) {
        incomingCallEl.style.display = "none";
        if (inCall) endCallLocal("Call ended");
        return;
      }
      if (offer.from === myName || inCall) return;

      incomingAvatar.textContent = offer.from.charAt(0).toUpperCase();
      incomingCallName.textContent = offer.from;
      incomingCallType.textContent = (offer.kind === "video" ? "Video call" : "Voice call") + "…";
      incomingCallEl.style.display = "flex";
    });

    db.ref("calls/status").on("value", (snap) => {
      const status = snap.val();
      if (status === "declined" && inCall && callRole === "caller") {
        showToast("Call declined");
        hangUp();
      }
    });
  }

  function setupPeerConnection() {
    pendingRemoteCandidates = [];
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      callStatusLabel.textContent = "Connected";
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        const path = callRole === "caller" ? "calls/candidates/caller" : "calls/candidates/callee";
        db.ref(path).push(event.candidate.toJSON());
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc && (pc.connectionState === "failed" || pc.connectionState === "closed")) {
        if (inCall) endCallLocal("Call disconnected");
      }
    };
  }

  function listenForRemoteCandidates(otherRole) {
    const path = "calls/candidates/" + otherRole;
    candidateListenerRef = db.ref(path);
    candidateListenerRef.on("child_added", (snap) => {
      const cand = snap.val();
      if (!cand || !pc) return;
      if (pc.remoteDescription && pc.remoteDescription.type) {
        pc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
      } else {
        pendingRemoteCandidates.push(cand);
      }
    });
  }

  function flushPendingCandidates() {
    pendingRemoteCandidates.forEach((cand) => {
      pc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
    });
    pendingRemoteCandidates = [];
  }

  function openCallUI(kind, status) {
    callOverlay.style.display = "block";
    callStatusLabel.textContent = status;
    if (kind === "video") {
      localVideo.style.display = "block";
      remoteVideo.style.display = "block";
      audioOnlyLabel.style.display = "none";
      localVideo.srcObject = localStream;
    } else {
      localVideo.style.display = "none";
      remoteVideo.style.display = "none";
      audioOnlyLabel.style.display = "flex";
      audioAvatar.textContent = myName.charAt(0).toUpperCase();
    }
    muteBtn.classList.remove("active");
    camBtn.classList.remove("active");
  }

  async function startCall(kind) {
    if (inCall) return;
    if (!ready) { showToast("Still connecting…"); return; }

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === "video" });
    } catch (err) {
      showToast("Couldn't access camera/mic: " + (err.message || err));
      return;
    }

    callRole = "caller";
    await db.ref("calls").remove().catch(() => {});
    setupPeerConnection();
    openCallUI(kind, "Calling…");
    inCall = true;

    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

    const offerDesc = await pc.createOffer();
    await pc.setLocalDescription(offerDesc);

    await db.ref("calls/offer").set({
      sdp: offerDesc.sdp,
      type: offerDesc.type,
      kind: kind,
      from: myName,
      time: Date.now()
    });

    answerListenerRef = db.ref("calls/answer");
    answerListenerRef.on("value", async (snap) => {
      const answer = snap.val();
      if (answer && pc && (!pc.remoteDescription || !pc.remoteDescription.type)) {
        await pc.setRemoteDescription(new RTCSessionDescription({ type: answer.type, sdp: answer.sdp }));
        flushPendingCandidates();
      }
    });

    listenForRemoteCandidates("callee");
  }

  async function acceptCall() {
    incomingCallEl.style.display = "none";
    const offerSnap = await db.ref("calls/offer").get();
    const offer = offerSnap.val();
    if (!offer) return;

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: offer.kind === "video" });
    } catch (err) {
      showToast("Couldn't access camera/mic: " + (err.message || err));
      await db.ref("calls/status").set("declined");
      return;
    }

    callRole = "callee";
    setupPeerConnection();
    openCallUI(offer.kind, "Connecting…");
    inCall = true;

    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription({ type: offer.type, sdp: offer.sdp }));
    flushPendingCandidates();

    const answerDesc = await pc.createAnswer();
    await pc.setLocalDescription(answerDesc);

    await db.ref("calls/answer").set({
      sdp: answerDesc.sdp,
      type: answerDesc.type,
      from: myName,
      time: Date.now()
    });

    listenForRemoteCandidates("caller");
  }

  function declineCall() {
    incomingCallEl.style.display = "none";
    db.ref("calls/status").set("declined");
  }

  function endCallLocal(toastMsg) {
    inCall = false;
    callRole = null;
    if (pc) { pc.close(); pc = null; }
    if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
    remoteVideo.srcObject = null;
    localVideo.srcObject = null;
    callOverlay.style.display = "none";
    if (answerListenerRef) { answerListenerRef.off(); answerListenerRef = null; }
    if (candidateListenerRef) { candidateListenerRef.off(); candidateListenerRef = null; }
    if (toastMsg) showToast(toastMsg);
  }

  function hangUp() {
    db.ref("calls").remove().catch(() => {});
    endCallLocal(null);
  }

  voiceCallBtn.addEventListener("click", () => startCall("audio"));
  videoCallBtn.addEventListener("click", () => startCall("video"));
  acceptBtn.addEventListener("click", acceptCall);
  declineBtn.addEventListener("click", declineCall);
  hangupBtn.addEventListener("click", hangUp);

  muteBtn.addEventListener("click", () => {
    if (!localStream) return;
    const track = localStream.getAudioTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    muteBtn.classList.toggle("active", !track.enabled);
  });

  camBtn.addEventListener("click", () => {
    if (!localStream) return;
    const track = localStream.getVideoTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    camBtn.classList.toggle("active", !track.enabled);
  });
</script>
</body>
</html>
